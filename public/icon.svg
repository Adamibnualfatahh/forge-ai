<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium near-black background with a subtle center lift for depth -->
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#1b1d1a" />
      <stop offset="1" stop-color="#0a0b0a" />
    </radialGradient>
    <!-- Brand lime with a soft top-to-bottom sheen -->
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ff45" />
      <stop offset="1" stop-color="#b6e600" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background (OS applies the rounded/squircle mask) -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Bold "F" monogram, centered within the maskable safe zone -->
  <g fill="url(#lime)">
    <!-- vertical stem -->
    <rect x="186" y="146" width="46" height="220" rx="13" />
    <!-- top arm -->
    <rect x="186" y="146" width="140" height="46" rx="13" />
    <!-- middle arm -->
    <rect x="186" y="234" width="104" height="44" rx="13" />
  </g>
</svg>
