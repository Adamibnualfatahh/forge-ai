<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=0" />
    <title>Forge AI</title>
    
    <!-- PWA & iOS App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forge AI" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  </head>
  <body>
    <div id="root">
      <!-- PWA Splash Screen (Renders instantly while JS bundles are loading) -->
      <div id="pwa-splash" style="
        position: fixed;
        inset: 0;
        background-color: #090a09;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
      ">
        <div style="
          position: relative;
          margin-bottom: 28px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
          animation: pulse 2s infinite ease-in-out;
        ">
          <img src="/icon.svg" alt="Forge AI" style="
            height: 104px;
            width: 104px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(195, 244, 0, 0.18), 0 2px 8px rgba(0,0,0,0.6);
          " />
          <span style="font-size: 16px; font-weight: 900; color: #ffffff; letter-spacing: 0.08em; text-transform: uppercase;">Forge AI</span>
        </div>
        <!-- iOS-style neon green spinner -->
        <div style="
          width: 24px;
          height: 24px;
          border: 2.5px solid rgba(195, 244, 0, 0.15);
          border-radius: 50%;
          border-top-color: #c3f400;
          animation: spin 0.8s linear infinite;
        "></div>
        <style>
          @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.04); opacity: 1; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
